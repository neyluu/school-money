name: Validate main PR source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate-source:
    name: PR must come from develop
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Pull requests to main must come from develop."
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "Pull request comes from develop."
